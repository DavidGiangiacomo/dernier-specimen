# Lance les tests automatiques du jeu (jeu/tests/) dans Godot 4.7.2, sans fenêtre,
# à chaque pull request et à chaque push sur main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Godot 4.7.2 (en cache)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-stable-linux

      - name: Télécharger Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Lancer les tests
        run: GODOT=~/godot/Godot_v4.7.2-stable_linux.x86_64 ./jeu/tests/lancer.sh
